# .air.toml
root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/api.exe"
  cmd = "go build -o ./tmp/api.exe ./cmd/api/main.go"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", ".git", ".agents", "openspec", ".wayfinder"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  include_ext = ["go", "tpl", "html", "env"]
  kill_delay = 500
  log = "air.log"
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = true
