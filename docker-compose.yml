name: venezuela-rates-api

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: venezuela_rates_api
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-8080}
      - DB_PATH=/data/rates.db
    volumes:
      - rates_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider --header=\"X-API-Key: ${API_KEY}\" http://localhost:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  rates_data:
    driver: local
